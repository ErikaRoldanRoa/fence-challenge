<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F023">
  <meta name="robots" content="noindex">
  <title>Enchivas · ton avis</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F5F023'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23F04625'/%3E%3C/svg%3E">
  <style>
    :root{
      --y:#F5F023; --r:#F04625; --ink:#161616; --muted:#555; --soft:#FBFAE0; --line:#161616;
      --sans:"Avenir Next","Helvetica Neue","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);line-height:1.45;-webkit-text-size-adjust:100%}
    .panel{background:var(--y);border-radius:22px;margin:max(10px,env(safe-area-inset-top)) 12px 0;padding:18px 16px 14px;text-align:center}
    .panel .wm{display:block;width:min(80%,340px);height:auto;margin:0 auto}
    .panel .tag{margin:8px 0 0;font-style:italic;font-weight:600;color:var(--r);font-size:15px}
    main{max-width:560px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
    .dots{display:flex;gap:7px;justify-content:center;margin:10px 0 4px;min-height:16px}
    .dots i{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
    .dots i.on{background:var(--r)}
    .pos{text-align:center;color:var(--muted);font-size:13px;min-height:18px;margin:0 0 6px}
    h1{font-size:28px;line-height:1.15;margin:8px 0 8px;font-weight:800;letter-spacing:-0.01em}
    h2{font-size:21px;line-height:1.3;margin:6px 0 6px;font-weight:700}
    h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus{outline:none}
    p.sub{color:var(--muted);margin:0 0 16px;font-size:16px}
    .stack{display:grid;gap:10px}
    .chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    @media (min-width:420px){.chips{grid-template-columns:repeat(3,1fr)}}
    button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .opt{width:100%;text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:12px 14px;min-height:50px;font-weight:700;font-size:16px;position:relative;transition:background .12s,transform .08s}
    .opt:active{transform:scale(.985)}
    .opt .d{display:block;font-weight:500;color:var(--muted);font-size:14px;margin-top:3px}
    .opt[aria-pressed="true"]{background:var(--y);padding-right:44px;box-shadow:0 0 0 2px var(--ink) inset}
    .opt[aria-pressed="true"]::after{content:"";position:absolute;right:14px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--r);border:2px solid var(--ink)}
    .chip{text-align:center;padding-left:8px;padding-right:8px}
    .chip[aria-pressed="true"]{padding-right:8px}
    .chip[aria-pressed="true"]::after{display:none}
    .scale{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    @media (min-width:520px){.scale{grid-template-columns:repeat(4,1fr)}}
    .scale .opt{text-align:center;font-size:14px;padding:10px 6px;min-height:46px}
    .scale .opt[aria-pressed="true"]{padding-right:6px}
    .scale .opt[aria-pressed="true"]::after{display:none}
    .sub2{color:var(--muted);margin:0 0 14px;font-size:15px}
    .stmt{border:2.5px solid var(--ink);border-radius:18px;padding:12px;margin-bottom:12px;background:var(--soft)}
    .stmt p{margin:0 0 10px;font-weight:700;font-size:16px}
    .nav{display:flex;gap:10px;align-items:center;margin-top:22px}
    .go{flex:1;border:0;border-radius:999px;padding:15px 20px;font-weight:800;font-size:17px;color:var(--y);background:var(--ink)}
    .go.alt{background:var(--r);color:var(--ink)}
    .back{border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:12px 16px;font-weight:800}
    .skip{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:15px}
    .go:focus-visible,.opt:focus-visible,.back:focus-visible,.skip:focus-visible,input:focus-visible{outline:3px solid var(--r);outline-offset:2px}
    .note{color:var(--muted);font-size:13px;margin-top:16px;text-align:center}
    .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:34px;letter-spacing:.18em;text-align:center;border:2.5px solid var(--ink);border-radius:16px;padding:10px 12px;background:var(--y);margin:14px 0 6px;font-weight:800}
    input.txt{width:100%;border:2.5px solid var(--ink);border-radius:14px;padding:13px 14px;font:inherit;font-size:22px;letter-spacing:.14em;text-transform:uppercase;text-align:center}
    .pending{display:none;color:#8a2a00;font-size:14px;margin-top:10px;text-align:center}
    .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
    .big{font-size:56px;line-height:1;text-align:center}
    .center{text-align:center}
    @media (prefers-reduced-motion:reduce){.opt{transition:none}}
  </style>
</head>
