function displayPolyhedron(data)
{
	scene.remove(polyhedronMesh);
	scene.remove(titleSprite);
	polyhedronMesh = polyhedronDataToMesh(data);
	titleSprite = makeTextSprite( "  " + data.name + "  ",
	    titleSpriteParams );
	titleSprite.position.set(window.innerWidth / 2, 10, 0);
	scene.add(titleSprite);
	scene.add(polyhedronMesh);
}
  

// change nominal offset 0.125 to true offsets
function adjust_offset_coordinate(x, ref)
  { // ref = 0 or 0.5
    x = x-ref  
    var i = Math.round(x);
    var y = x-i;
    var s;
    if (y<0)
    {
        s = -1;
	y = -y;
    }
    else
        s = +1;
    offset = scene.offset;
    if (y==0.375)
            y = 0.5-offset;
    else if (y==0.625)
            y = 0.5+offset;
    return i+ref+s*y;
}	    

function adjust_offset_coordinates(v, refpoint)
{
    return new THREE.Vector3( adjust_offset_coordinate(v[0], refpoint[0]),
			      adjust_offset_coordinate(v[1], refpoint[1]),
			      adjust_offset_coordinate(v[2], refpoint[2]) );
}

function polyhedronDataToMesh(data)
{
	var polyhedron = new THREE.Object3D();
	
	// convert vertex data to THREE.js vectors
	var vertex = [] 
	for (var i = 0; i < data.vertex.length; i++)
		// vertex.push( new THREE.Vector3( data.vertex[i][0], data.vertex[i][1], data.vertex[i][2] ).multiplyScalar(100) );
		vertex.push( adjust_offset_coordinates(data.vertex[i], data.refpoint).multiplyScalar(100) );

	var vertexGeometry = new THREE.SphereGeometry( 2, 12, 6 );  // was 6, not one in original (vertices much bigger)
                // with new vertex size 1, they blend in to the edges; 1.5 would make them slightly visible
	var vertexMaterial = new THREE.MeshLambertMaterial( { color: 0x222244 } );
	var vertexSingleMesh = new THREE.Mesh( vertexGeometry );

	var vertexAmalgam = new THREE.Geometry();
	for (var i = 0; i < data.node.length; i++)
	{
		var vMesh = vertexSingleMesh.clone();
		vMesh.position = vertex[data.node[i]];
		THREE.GeometryUtils.merge( vertexAmalgam, vMesh );
	}
	var vertexMesh = new THREE.Mesh( vertexAmalgam, vertexMaterial );
	polyhedron.add( vertexMesh );
	
	// convert edge data to cylinders
	var edgeMaterial = new THREE.MeshLambertMaterial( {color: 0x666666} );
	var edgeAmalgam = new THREE.Geometry();

	for (var i = 0; i < data.edge.length; i++)
	{
		var index0 = data.edge[i][0];
		var index1 = data.edge[i][1];
		var eMesh = cylinderMesh( vertex[index0], vertex[index1], edgeMaterial, 1.6 ); // was 2
		THREE.GeometryUtils.merge( edgeAmalgam, eMesh );
	}
	var edgeMesh = new THREE.Mesh( edgeAmalgam, edgeMaterial );
	polyhedron.add( edgeMesh );
	
	// convert face data to a single (triangulated) geometry
	var faceMaterial = new THREE.MeshBasicMaterial( { color: 0xffffff, vertexColors: THREE.FaceColors, side: THREE.DoubleSide, transparent:scene.transparent, opacity:0.8 } );  // possible to experiment with MeshPhongMaterial, MeshLambertMaterial
// changed from FrontSide to DoubleSide
	var faceColors = 
	{
	    3: new THREE.Color( 0xcc0000 ), // red
	    5: new THREE.Color( 0x00cc00 ), // green
	    2: new THREE.Color( 0x0000cc ), // blue
	    6: new THREE.Color( 0xcccc00 ), // yellow
	    1: new THREE.Color( 0x999999 ), // gray
	    7: new THREE.Color( 0x990099 ) // purple
	    //9: new THREE.Color( 0xff6600 ), // orange
	    //10: new THREE.Color( 0x6666ff ) // light blue
	};
	
    var geometry = new THREE.Geometry();
    geometry.vertices = vertex;
    var own_colors = data.hasOwnProperty("colors");
    var Fcolors = [];
    if (own_colors)
    {
	for (var i = 0; i < data.colors.length; i++)
	    Fcolors.push(new THREE.Color(data.colors[i]));
    }
    var faceIndex = 0;
    for (var faceNum = 0; faceNum < data.face.length; faceNum++)
    {
	for (var i = 0; i < data.face[faceNum].length - 2; i++)
	{
	    geometry.faces[faceIndex] = new THREE.Face3( data.face[faceNum][0], data.face[faceNum][i+1], data.face[faceNum][i+2] );
//	    geometry.faces[faceIndex].color = faceColors[data.face[faceNum].length]; // original
	    if (own_colors)
		geometry.faces[faceIndex].color = Fcolors[data.facecolor[faceNum]];
	    else
		geometry.faces[faceIndex].color = faceColors[4+data.facedirection[faceNum]];
	    faceIndex++;
	}
    }
// This is with a 3js version that is a bit outdated.
// The modern approach should use BufferedGeometry and an indexed representation of faces

// From https://threejs.org/manual/#en/transparency :
//The cube has 12 triangles, 2 for each face, and the order they are drawn is the same order they are built in the geometry so depending on which direction we are looking the triangles closer to the camera might get drawn first. In that case the triangles in the back aren't drawn. This is why sometimes we don't see the backs.

//initMouseEvent() sollte nicht mehr verwendet werden. Verwenden Sie stattdessen den MouseEvent()-Konstruktor.	    

				    
	geometry.computeFaceNormals();
	geometry.computeVertexNormals();

	faces = new THREE.Mesh(geometry, faceMaterial);
//	faces.scale.multiplyScalar(1.01); // this works only for convex
				          // (or starshaped) bodies with the origin inside.
	polyhedron.add(faces);
	
//	var interiorMaterial = new THREE.MeshBasicMaterial( { color: 0xffffff, vertexColors: THREE.FaceColors, side: THREE.BackSide } ); // orig
//	var interiorMaterial = new THREE.MeshBasicMaterial( { // color: 0xffffff,
//				    vertexColors: THREE.FaceColors, side: THREE.BackSide,
//				    transparent:true, opacity:0.8 } );
	// this is supposed to make both sides of a face the same
	// GR: But it doesn't.
	// original: transparent:parameters.transparent changed to false
	// (Interior faces should always be transparent!)

//	var interiorFaces = new THREE.Mesh(geometry, interiorMaterial);
//      interiorFaces.scale.multiplyScalar(0.99);
//	polyhedron.add( interiorFaces );
	
	return polyhedron;
}

function cylinderMesh(point1, point2, material, thickness)
{
    var direction = new THREE.Vector3().subVectors(point2, point1);
    var arrow = new THREE.ArrowHelper(direction.clone().normalize(), point1);
    var rotation = new THREE.Vector3().setEulerFromQuaternion(arrow.quaternion);
    var edgeGeometry = new THREE.CylinderGeometry( thickness, thickness, direction.length(), 8, 4 ); // 1,1 was 2,2 in original (thicker edges)
    var edge = new THREE.Mesh(edgeGeometry, material); 
    edge.position = new THREE.Vector3().addVectors(point1, direction.multiplyScalar(0.5));
	edge.rotation = rotation;
	return edge;

	// the result should align with:
	//   scene.add( new THREE.ArrowHelper( direction.clone().normalize(), point1, direction.length()) );
}

function makeTextSprite( message, parameters )
{
	if ( parameters === undefined ) parameters = {};
	
	var fontface = parameters.hasOwnProperty("fontface") ? 
		parameters["fontface"] : "Arial";
	
	var fontsize = parameters.hasOwnProperty("fontsize") ? 
		parameters["fontsize"] : 18;
	
	var borderThickness = parameters.hasOwnProperty("borderThickness") ? 
		parameters["borderThickness"] : 4;
	
	var borderColor = parameters.hasOwnProperty("borderColor") ?
		parameters["borderColor"] : { r:0, g:0, b:0, a:1.0 };
	
	var backgroundColor = parameters.hasOwnProperty("backgroundColor") ?
		parameters["backgroundColor"] : { r:255, g:255, b:255, a:1.0 };

	var useScreenCoordinates = parameters.hasOwnProperty("useScreenCoordinates") ?
		parameters["useScreenCoordinates"] : false;
	
	var spriteAlignment = parameters.hasOwnProperty("spriteAlignment") ?
		parameters["spriteAlignment"] : THREE.SpriteAlignment.topLeft;
		
	// create canvas, resize later.
	var canvas = document.createElement('canvas');
	var context = canvas.getContext('2d');
	context.font = "Bold " + fontsize + "px " + fontface;
    
	// get size data (height depends only on font size)
	var metrics = context.measureText( message );
	var textWidth = metrics.width;
	
	// calculate correct dimensions of canvas and resize
	var imageWidth = textWidth + borderThickness * 2;
	var imageHeight = fontsize * 1.44 + borderThickness * 2;
	canvas.width = imageWidth;
	canvas.height = imageHeight;
	// new canvas, new context.
	context = canvas.getContext('2d');
	context.font = "Bold " + fontsize + "px " + fontface;
	
	// background color
	context.fillStyle   = "rgba(" + backgroundColor.r + "," + backgroundColor.g + ","
								  + backgroundColor.b + "," + backgroundColor.a + ")";
	// border color
	context.strokeStyle = "rgba(" + borderColor.r + "," + borderColor.g + ","
								  + borderColor.b + "," + borderColor.a + ")";

	context.lineWidth = borderThickness;
	roundRect(context, borderThickness/2, borderThickness/2, textWidth + borderThickness, fontsize * 1.4 + borderThickness, 6);
	// 1.4 is extra height factor for text below baseline: g,j,p,q.
	
	// text color
	context.fillStyle = "rgba(0, 0, 0, 1.0)";

	context.fillText( message, borderThickness, fontsize + borderThickness );
	
	// canvas contents will be used for a texture
	var texture = new THREE.Texture(canvas) 
	texture.needsUpdate = true;

	var spriteMaterial = new THREE.SpriteMaterial( 
		{ map: texture, useScreenCoordinates: useScreenCoordinates, alignment: spriteAlignment } );
	var sprite = new THREE.Sprite( spriteMaterial );
	sprite.scale.set(imageWidth, imageHeight, 1.0);
	sprite.width = imageWidth;
	sprite.height = imageHeight;
	return sprite;	
}

// function for drawing rounded rectangles
function roundRect(ctx, x, y, w, h, r) 
{
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
    ctx.fill();
	ctx.stroke();   
}
