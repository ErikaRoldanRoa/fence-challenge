<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title data-i18n="hx.docTitle">35 hexominoes · Fence Challenge</title>
    <meta name="theme-color" content="#07060a" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../fonts/manrope.css" />
    <link rel="stylesheet" href="../play-ui.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="../i18n.js"></script>
    <script src="i18n.js"></script>
  </head>
  <body>
    <main class="lab" id="lab" data-mode="build">
      <h1 class="visually-hidden" data-i18n="hx.title">35 hexominoes</h1>

      <!-- Top left: what acts on the chosen piece (build) or on the arrows. -->
      <div class="acts">
        <div class="tools build-only">
          <button id="rotate" class="ctl act" type="button" aria-keyshortcuts="R" data-i18n-title="hx.rotate" data-i18n-aria-label="hx.rotate" title="Turn (R)" aria-label="Turn (R)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.4 8.6A7.2 7.2 0 1 0 19.2 13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M19.6 4.4v4.8h-4.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button id="flip" class="ctl act" type="button" aria-keyshortcuts="F" data-i18n-title="hx.flip" data-i18n-aria-label="hx.flip" title="Flip (F)" aria-label="Flip (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 8.5h14.5M15.5 5l3.5 3.5-3.5 3.5M19.5 15.5H5M8.5 12 5 15.5 8.5 19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button id="remove" class="ctl act" type="button" aria-keyshortcuts="Delete" data-i18n-title="hx.remove" data-i18n-aria-label="hx.remove" title="Put back" aria-label="Put back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button>
        </div>
        <div class="tools arrows-only">
          <button id="shuffle" class="ctl act" type="button" data-i18n-title="hx.shuffle" data-i18n-aria-label="hx.shuffle" title="Shuffle" aria-label="Shuffle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3.5c4 0 5 10 9 10H20M4 17h3.5c1.6 0 2.7-1.6 3.6-3.6M13 9.6c.9-1.6 2-2.6 3.5-2.6H20M17.5 4.5 20 7l-2.5 2.5M17.5 14.5 20 17l-2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <span class="chipHost btn"><button id="sort" class="ctl act" type="button" data-i18n-title="hx.sort" data-i18n-aria-label="hx.sort" title="Sort" aria-label="Sort"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 19.4 8v8L12 20.5 4.6 16V8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 3.5 19.4 8" stroke="#2ff3ff" stroke-width="2.2" stroke-linecap="round"/><path d="M19.4 16 12 20.5" stroke="#ff8a3d" stroke-width="2.2" stroke-linecap="round"/></svg></button><button class="math-chip" type="button" hidden data-chip="p2">∑</button></span>
          <span class="chipHost btn"><button id="corners" class="ctl act" type="button" aria-pressed="false" data-i18n-title="hx.corners" data-i18n-aria-label="hx.corners" title="Corner pieces" aria-label="Corner pieces"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9a4 4 0 0 1 4-4h10" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><text x="10" y="17" font-size="7.5" font-weight="700" fill="currentColor" font-family="ui-monospace,monospace">90°</text></svg></button><button class="math-chip" type="button" hidden data-chip="rotation">∑</button></span>
        </div>
      </div>

      <!-- Top centre: the area, or the equation of the arrows. -->
      <div class="readout">
        <span class="chipHost"><span class="measure" id="area-pill"><span class="area-word" data-i18n="hx.area">area</span><strong class="area-num" id="area-value">0</strong></span><button class="math-chip" type="button" hidden data-chip="area">∑</button></span>
        <span class="jump" id="jump" hidden></span>
        <div class="equation" id="equation">
          <span class="chipHost"><span class="tok" id="tok-ref" data-i18n-title="hx.polygon" title="Signed area of the reference polygon"><span class="sw sw-poly" aria-hidden="true"></span><span class="tokWord" data-i18n="hx.signed">signed area</span><strong id="val-ref">0</strong></span><button class="math-chip" type="button" hidden data-chip="bound">∑</button></span>
          <span class="bound" id="bound-tag" hidden></span>
          <span class="eqRest">
            <span class="op">+</span>
            <span class="tok" id="tok-delta" data-i18n-title="hx.corrections" title="Sum of the corrections"><span class="sw sw-delta" aria-hidden="true"></span><strong id="val-delta">0</strong></span>
            <span class="op">=</span>
            <span class="chipHost"><span class="tok" id="tok-area" data-i18n-title="hx.area" title="Area"><span class="sw sw-region" aria-hidden="true"></span><strong id="val-area">0</strong></span><button class="math-chip" type="button" hidden data-chip="lemma">∑</button></span>
          </span>
        </div>
      </div>

      <!-- Top right: the two views, the other labs, the language. -->
      <nav class="topnav">
        <div class="modes" role="group" data-i18n-aria-label="hx.views" aria-label="Views">
          <button id="mode-build" class="ctl mode" type="button" aria-pressed="true" data-i18n-title="hx.build" data-i18n-aria-label="hx.build" title="Build" aria-label="Build"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM10 4h6v6h-6zM16 10h4v6h-4zM4 10h6v6H4zM4 16h6v4H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
          <span class="chipHost btn"><button id="mode-arrows" class="ctl mode" type="button" aria-pressed="false" data-i18n-title="hx.arrows" data-i18n-aria-label="hx.arrows" title="Reference vectors" aria-label="Reference vectors"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17 9 6M9 6l9 3M18 9l-3 10M15 19 5 17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="m7.2 8.6 1.8-2.6 1.2 2.9M15.5 7.4l2.5 1.6-2.8 1.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="math-chip" type="button" hidden data-chip="refvec">∑</button></span>
        </div>
        <span class="lab-nav">
          <a class="ctl nav" href="../cube-lab/" data-i18n-title="hx.toCube" data-i18n-aria-label="hx.toCube" title="Walls in 3D" aria-label="Walls in 3D"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 19.5 7.7v8.6L12 20.5l-7.5-4.2V7.7z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M4.5 7.7 12 12l7.5-4.3M12 12v8.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></a>
          <a class="ctl nav" href="../" data-i18n-aria-label="common.home" data-i18n-title="common.home" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.4 12 4.6l8 6.8M6.4 9.6v9.9h4.2v-5.4h2.8v5.4h4.2V9.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        </span>
      </nav>

      <span class="langSel" aria-label="Language / Langue / Sprache" role="group">
        <button type="button" data-lang-btn="fr" aria-pressed="false" lang="fr">FR</button>
        <button type="button" data-lang-btn="de" aria-pressed="false" lang="de">DE</button>
        <button type="button" data-lang-btn="en" aria-pressed="false" lang="en">EN</button>
      </span>

      <!-- Left: the 35 pieces. -->
      <aside class="dock build-only">
        <div class="tray" id="tray" role="toolbar" aria-orientation="horizontal" data-i18n-aria-label="hx.tray" aria-label="The 35 hexominoes"></div>
      </aside>

      <section class="stage" id="stage">
        <canvas id="board" tabindex="0" role="application" aria-keyshortcuts="R F Delete ArrowLeft ArrowRight ArrowUp ArrowDown Enter Control+Z" data-i18n-aria-label="hx.board" aria-label="Board"></canvas>
        <div class="zoom">
          <button id="zoom-in" class="ctl quiet" type="button" data-i18n-title="hx.zoomIn" data-i18n-aria-label="hx.zoomIn" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          <button id="zoom-out" class="ctl quiet" type="button" data-i18n-title="hx.zoomOut" data-i18n-aria-label="hx.zoomOut" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          <button id="zoom-fit" class="ctl quiet" type="button" data-i18n-title="hx.fit" data-i18n-aria-label="hx.fit" title="Show all" aria-label="Show all"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9V4.5H9M15 4.5h4.5V9M19.5 15v4.5H15M9 19.5H4.5V15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
        <div class="card" id="card" role="dialog" aria-modal="false" aria-labelledby="card-lead" tabindex="-1" hidden>
          <button class="ctl quiet cardClose" id="card-close" type="button" data-i18n-aria-label="hx.close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          <p class="cardLead" id="card-lead"></p>
          <div class="cardBody" id="card-body"></div>
          <div class="cardFoot" id="card-section"></div>
        </div>
      </section>

      <!-- Under the board: erase and undo, the brand link, the two known fences. -->
      <footer class="bar boardbar">
        <span class="build-only barGroup">
          <button id="clear" class="ctl quiet erase" type="button" data-i18n-title="hx.clear" data-i18n-aria-label="hx.clear" title="Clear all" aria-label="Clear all"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.8h15M9.5 6.6V4.4h5v2.2M6.6 6.9l.9 12.7h9l.9-12.7M10.2 10.4v6M13.8 10.4v6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="again" id="again" data-i18n="hx.again" hidden>again?</span>
          <button id="undo" class="ctl quiet" type="button" aria-keyshortcuts="Control+Z" data-i18n-title="hx.undo" data-i18n-aria-label="hx.undo" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4.5 11.5 9 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 11.5h9a5 5 0 0 1 0 10h-3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button>
        </span>
        <a class="side-brand" id="side-brand-link" href="../">Fence Challenge</a>
        <span class="barGroup loaders">
          <span class="chipHost btn"><button id="load2025" class="ctl chipBtn" type="button" data-i18n-title="hx.load2025" data-i18n-aria-label="hx.load2025" title="The 2025 fence" aria-label="The 2025 fence">2025</button><button class="math-chip" type="button" hidden data-chip="record2025">∑</button></span>
          <span class="chipHost btn"><button id="reveal" class="ctl star" type="button" data-i18n-title="hx.reveal" data-i18n-aria-label="hx.reveal" title="The paper’s fence" aria-label="The paper’s fence"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.6 2.5 5.3 5.8.7-4.3 4 1.1 5.7L12 16.5l-5.1 2.8L8 13.6l-4.3-4 5.8-.7z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button><button class="math-chip" type="button" hidden data-chip="thm1597">∑</button></span>
        </span>
      </footer>

      <p class="visually-hidden" id="status" role="status" aria-live="polite"></p>
    </main>

    <script defer src="fence-math.js"></script>
    <script defer src="pieces.js"></script>
    <script defer src="chips.js"></script>
    <script defer src="data/fences.js"></script>
    <script defer src="app.js"></script>
  </body>
</html>
