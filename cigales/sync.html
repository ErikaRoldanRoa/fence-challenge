<!doctype html><html><head><meta charset="utf-8"><title>sync</title></head><body>
<script>
// Sends the contest records the Fence Challenge queued on this phone (localStorage, same origin). No UI.
(() => {
  let busy = false, again = false, closed = false;
  const read = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || 'null') || d; } catch (e) { return d; } };
  async function flush() {
    if (closed) return;
    if (busy) { again = true; return; } busy = true; again = false;
    try {
      const ctx = read('fc-contest', null);
      if (!ctx || !ctx.api) return;
      let team = '';
      try { if (ctx.group === 'cigales') team = localStorage.getItem('cigales-team') || ''; } catch (e) {}
      for (const r of read('fc-contest-queue', [])) {
        if (r.workshop !== ctx.workshop) continue;
        let ok = false;
        for (let i = 0; i < 5 && !ok; i++) {
          try {
            const res = await fetch(ctx.api, { method: 'POST', headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({ action: 'submitFence', workshop: ctx.workshop, token: ctx.token, device: ctx.device, name: ctx.name, team, board: r.board, area: r.area }) });
            const j = await res.json();
            ok = j.status === 'ok' && !j.queued;
            // The contest is over (Thursday 19:30): nothing more is sent, the page is told once.
            if (j.status === 'closed') { closed = true; try { parent.postMessage({ fcClosed: j.closes || true }, location.origin); } catch (e) {} break; }
            // Where this record stands on its board among all players: the page celebrates (party already; trophy if it leads).
            if (ok && typeof j.top === 'number') { try { parent.postMessage({ fcRank: { board: r.board, area: j.best, top: j.top, leader: !!j.leader, record: !!j.record } }, location.origin); } catch (e) {} }
          } catch (e) {}
          if (!ok) await new Promise(s => setTimeout(s, 1500 * (i + 1)));
        }
        if (closed) { try { localStorage.setItem('fc-contest-queue', JSON.stringify(read('fc-contest-queue', []).filter(x => x.workshop !== r.workshop))); } catch (e) {} break; }
        if (ok) {
          // Only the entry just sent leaves the queue: during the contest a board's areas only grow, in free play (after 19:30) they go up and down and a lower fence queued meanwhile is still to be sent.
          const q = read('fc-contest-queue', []).filter(x => !(x.workshop === r.workshop && x.board === r.board && x.area === r.area));
          try { localStorage.setItem('fc-contest-queue', JSON.stringify(q)); } catch (e) {}
        }
      }
    } finally { busy = false; if (again) setTimeout(flush, 50); }
  }
  addEventListener('message', e => { if (e.origin === location.origin && e.data === 'fc-contest-sync') flush(); });
  addEventListener('storage', e => { if (e.key === 'fc-contest-queue') flush(); });
  flush(); setInterval(flush, 20000);
  // The version the site serves now (cigales/version.txt, never cached): the page shows an update chip when it differs.
  async function version() {
    try { const v = (await (await fetch('version.txt', { cache: 'no-store' })).text()).trim(); if (v) parent.postMessage({ fcVersion: v }, location.origin); } catch (e) {}
  }
  version(); setInterval(version, 90000);
})();
</script></body></html>
