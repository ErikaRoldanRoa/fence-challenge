<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preload" as="script" href="../i18n.js" />
  <link rel="preload" as="script" href="./i18n.js" />
  <link rel="preload" as="script" href="../lattice-hex.js" />
  <link rel="preload" as="script" href="../fence-analysis.js" />
  <link rel="preload" as="script" href="../play-ui.js" />
  <link rel="preload" as="script" href="./app.js" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="hx.pageTitle">Challenge 3 · 7 tetrahexes · Fence Challenge</title>
  <link rel="stylesheet" href="../fonts/manrope.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="../camera/inboard.css" />
  <link rel="stylesheet" href="../play-ui.css" />
  <script src="../i18n.js"></script>
  <script src="./i18n.js"></script>
  <meta name="theme-color" content="#07060a" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
</head>
<body>
  <nav class="langSel" data-i18n-aria-label="common.langLabel" aria-label="Language">
    <button type="button" data-lang-btn="fr" aria-pressed="false" lang="fr">FR</button>
    <button type="button" data-lang-btn="de" aria-pressed="false" lang="de">DE</button>
    <button type="button" data-lang-btn="en" aria-pressed="false" lang="en">EN</button>
  </nav>

  <div class="app-shell">
    <main class="main-stage">
      <h1 class="visually-hidden" data-i18n="hx.h1">Challenge 3 · 7 tetrahexes</h1>
      <header class="toolbar">
        <button id="detect-area" class="measure" type="button" data-i18n-aria-label="common.detectArea" aria-label="Measure area" data-i18n-title="common.detectArea" title="Measure area"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h16v16H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-dasharray="3 2.2"/><path d="M8.5 8.5h7v7h-7z" fill="currentColor" opacity="0.85"/></svg><span id="area-chip">Area: 0</span></button>
      </header>

      <section class="play-zone">
        <section class="board-wrap" id="board-wrap">
          <canvas id="board-canvas" width="1200" height="980" tabindex="0" role="application" data-i18n-aria-label="hx.board.ariaLabel" aria-label="Hexagon board: the arrow keys move the chosen piece, R turns it, F flips it, Delete removes it."></canvas>
          <div id="camera-host" class="camera-host" hidden></div>
          <div id="piece-tray" class="piece-ring" role="group" data-i18n-aria-label="hx.tray.ariaLabel" aria-label="Tetrahex pieces"></div>
          <div class="board-actions">
            <button id="rotate-piece" class="ctl act" type="button" aria-keyshortcuts="R" data-i18n-aria-label="hx.rotateTipTouch" aria-label="Rotate the selected piece" data-i18n-title="hx.rotateTip" title="Rotate the selected piece (R key)"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18.4 8.6A7.2 7.2 0 1 0 19.2 13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M19.6 4.4v4.8h-4.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button id="flip-piece" class="ctl act" type="button" aria-keyshortcuts="F" data-i18n-aria-label="hx.flipTipTouch" aria-label="Flip the selected piece" data-i18n-title="hx.flipTip" title="Flip the selected piece (F key)"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 8.5h14.5M15.5 5l3.5 3.5-3.5 3.5M19.5 15.5H5M8.5 12 5 15.5 8.5 19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
        </section>
      </section>

      <footer class="boardbar">
        <button id="clear-board" class="ctl quiet erase" type="button" data-arm="common.clearConfirm" data-i18n-aria-label="common.clear" aria-label="Clear" data-i18n-title="common.clear" title="Clear"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 6.8h15M9.5 6.6V4.4h5v2.2M6.6 6.9l.9 12.7h9l.9-12.7M10.2 10.4v6M13.8 10.4v6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <a
            class="side-brand"
            href="https://doi.org/10.1515/dmvm-2025-0056"
            target="_blank"
            rel="noreferrer"
            data-i18n-title="hx.cite.title" title="Cite: Langlois-Rémillard · Müßig · Roldán, Maximale Zäune mit Polyformen, DMVM Mitteilungen 33(3), 187–199, 2025, doi:10.1515/dmvm-2025-0056"
            data-i18n="hx.cite.text">Polyhex Fence · LRMR25 · Dr. Erika Roldán</a>
        <button id="camera-chip" class="ctl cam" type="button" hidden aria-pressed="false" data-i18n-aria-label="hx.cameraOpen" aria-label="Open the camera on the board" data-i18n-title="hx.cameraOpen" title="Open the camera on the board"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 8.2h3.6l1.7-2.6h6.4l1.7 2.6h3.6v10.6H3.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13.3" r="3.3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
      </footer>
      <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
    </main>
  </div>

  <script src="../lattice-hex.js"></script>
  <script src="../fence-analysis.js"></script>
  <script src="../play-ui.js"></script>
  <script src="./app.js"></script>
  <script defer src="../vendor/js-aruco2/cv.js"></script>
  <script defer src="../vendor/js-aruco2/aruco.js"></script>
  <script defer src="../vendor/js-aruco2/dictionaries/aruco_4x4_1000.js"></script>
  <script defer src="../camera/boards.js"></script>
  <script defer src="../camera/core.js"></script>
  <script defer src="../camera/inboard.js"></script>
</body>
</html>
