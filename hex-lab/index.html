<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-i18n="hx.pageTitle">Challenge 3 · 7 tetrahexes · Fence Challenge</title>
  <meta name="theme-color" content="#060c18" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../fonts/manrope.css" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="../i18n.js"></script>
  <script src="./i18n.js"></script>
</head>
<body>
  <div class="app">
    <header class="lab-header">
      <a class="back-link" href="../index.html" data-i18n-aria-label="hx.homeAria" aria-label="Back to the Fence Challenge home page"><span aria-hidden="true">←</span> <span class="back-text">Fence Challenge</span></a>
      <h1 class="lab-title" data-i18n="hx.h1">Challenge 3 · 7 tetrahexes</h1>
      <div class="header-end">
        <a id="camera-link" class="camera-link" href="../camera/?board=hex6" data-i18n-title="hx.cameraTip" title="Play on paper: build your fence with real pieces and let the camera read it." data-i18n-aria-label="hx.camera" aria-label="Play on paper">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9 5.5 10.2 4h3.6L15 5.5h2.7A2.3 2.3 0 0 1 20 7.8v8.5a2.3 2.3 0 0 1-2.3 2.2H6.3A2.3 2.3 0 0 1 4 16.3V7.8a2.3 2.3 0 0 1 2.3-2.3H9Zm3 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 1.8a2.2 2.2 0 1 1 0 4.4 2.2 2.2 0 0 1 0-4.4Z" />
          </svg>
          <span class="camera-text" data-i18n="hx.camera">Play on paper</span>
        </a>
        <nav class="langSel" data-i18n-aria-label="common.langLabel" aria-label="Language">
          <button type="button" data-lang-btn="fr" aria-pressed="false" lang="fr">FR</button>
          <button type="button" data-lang-btn="de" aria-pressed="false" lang="de">DE</button>
          <button type="button" data-lang-btn="en" aria-pressed="false" lang="en">EN</button>
        </nav>
      </div>
    </header>

    <main class="main" id="main">
      <p class="goal" data-i18n="hx.goal">Find the largest area you can enclose.</p>

      <div class="toolbar">
        <button id="detect-area" class="chip chip-primary" type="button" data-i18n="common.detectArea">Measure area</button>
        <div id="area-chip" class="chip chip-area"><span data-i18n="common.areaLabel">Area</span> <span id="area-value" class="area-value">0</span></div>
        <button id="clear-board" class="chip chip-danger" type="button" data-i18n="common.clear">Clear</button>
      </div>

      <section class="stage" id="stage">
        <div class="board-wrap" id="board-wrap">
          <canvas id="board-canvas" width="600" height="600" role="img" data-i18n-aria-label="hx.board.ariaLabel" aria-label="Hexagon board"></canvas>
          <div id="piece-tray" class="piece-tray" role="group" data-i18n-aria-label="hx.tray.ariaLabel" aria-label="Tetrahex pieces"></div>
        </div>
      </section>

      <div class="board-actions">
        <button id="rotate-piece" class="chip action-chip" type="button" data-i18n="hx.rotate" data-i18n-title="hx.rotateTip" title="Rotate the selected piece (R key)">Rotate</button>
        <button id="flip-piece" class="chip action-chip" type="button" data-i18n="hx.flip" data-i18n-title="hx.flipTip" title="Flip the selected piece (F key)">Flip</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>

    <footer class="cite-bar">
      <a class="cite" href="https://doi.org/10.1515/dmvm-2025-0056" target="_blank" rel="noreferrer" data-i18n-title="hx.cite.title" title="Cite: Langlois-Rémillard · Müßig · Roldán, Maximale Zäune mit Polyformen, DMVM Mitteilungen 33(3), 187–199, 2025, doi:10.1515/dmvm-2025-0056"><span data-i18n="hx.cite.text">Polyhex Fence · LRMR25 · Dr. Erika Roldán</span></a>
    </footer>
  </div>

  <script src="../lattice-hex.js"></script>
  <script src="../fence-analysis.js"></script>
  <script src="./app.js"></script>
</body>
</html>
